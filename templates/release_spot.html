<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Release Parking - ParkingPro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f2f2f2;
        }
        .form-section {
            background-color: #fff;
            padding: 40px;
            border-radius: 8px;
            margin-top: 80px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

<div class="container">
    <h2 class="text-center mb-4">Release Your Parking Spot</h2>
    <div class="row justify-content-center">
        <div class="col-md-6 form-section">
            {% if active_booking %}
                <p><strong>Spot:</strong> {{ active_booking.spot_id }}</p>
                <p><strong>Parking Lot:</strong> {{ active_booking.lot.prime_location_name }}</p>
                <p><strong>Parked Since:</strong> {{ active_booking.parking_timestamp }}</p>
                <form method="POST" action="/user/release">
                    <button type="submit" class="btn btn-danger w-100">Release Now</button>
                </form>
            {% else %}
                <p class="text-center text-muted">You don’t have any active parking bookings right now.</p>
            {% endif %}
        </div>
    </div>
</div>

</body>
</html>
