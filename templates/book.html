<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Book Parking | ParkingPro</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body {
      background: url('https://source.unsplash.com/1600x900/?parking,lot,street') no-repeat center center/cover;
      min-height: 100vh;
    }
    .booking-section {
      background-color: rgba(255,255,255,0.97);
      padding: 40px;
      max-width: 600px;
      margin: 80px auto;
      border-radius: 15px;
      box-shadow: 0 0 25px rgba(0,0,0,0.2);
    }
    .map-placeholder {
      background-color: #e6e6e6;
      height: 200px;
      border: 1px dashed #999;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #666;
      font-size: 1.2rem;
      border-radius: 10px;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>

  <div class="booking-section">
    <h2 class="text-center mb-4">Book Your Parking Spot</h2>

    <form method="POST" action="/book">
      <div class="mb-3">
        <label for="location" class="form-label">Enter Location</label>
        <input type="text" name="location" class="form-control" placeholder="e.g., Chennai Central" required />
      </div>

      <div class="mb-3">
        <label for="pincode" class="form-label">Pin Code</label>
        <input type="text" name="pincode" class="form-control" placeholder="e.g., 600003" required />
      </div>

      <div class="map-placeholder">
        Map View (optional map or image goes here)
      </div>

      <div class="d-grid">
        <button type="submit" class="btn btn-success">Search & Book Spot</button>
      </div>
    </form>
  </div>

</body>
</html>
