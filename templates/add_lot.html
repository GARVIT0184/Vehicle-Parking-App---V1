<!-- templates/add_lot.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Parking Lot</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h2 class="mb-4">Add New Parking Lot</h2>
        <form method="POST">
            <div class="mb-3">
                <label for="name" class="form-label">Lot Name</label>
                <input type="text" name="name" class="form-control" required>
            </div>
            <div class="mb-3">
                <label for="address" class="form-label">Address</label>
                <input type="text" name="address" class="form-control" required>
            </div>
            <div class="mb-3">
                <label for="pincode" class="form-label">Pincode</label>
                <input type="text" name="pincode" class="form-control" required>
            </div>
            <div class="mb-3">
                <label for="price" class="form-label">Price per hour (₹)</label>
                <input type="number" name="price" class="form-control" required>
            </div>
            <div class="mb-3">
                <label for="total_spots" class="form-label">Total Spots</label>
                <input type="number" name="total_spots" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-success">Add Lot</button>
            <a href="/admin_dashboard" class="btn btn-secondary">Back</a>
        </form>
    </div>
</body>
</html>
