<!-- templates/login.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login to ParkingPro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body style="background-color: #f4f4f4;">
    <div class="container mt-5">
        <div class="col-md-6 offset-md-3 p-4 bg-white rounded shadow">
            <h2 class="mb-4 text-center">Login to ParkingPro</h2>

            <!-- Display error if login fails -->
            {% if error %}
                <div class="alert alert-danger text-center">{{ error }}</div>
            {% endif %}

            <form method="POST" action="{{ url_for('controller.login') }}">
  <div class="mb-3">
    <label for="username">Username</label>
    <input type="text" name="username" class="form-control" required>
  </div>

  <div class="mb-3">
    <label for="password">Password</label>
    <input type="password" name="password" class="form-control" required>
  </div>

  <div class="mb-3">
    <label for="role">Login as</label>
    <select name="role" class="form-control" required>
      <option value="admin">Admin</option>
      <option value="user">User</option>
    </select>
  </div>

  <button type="submit" class="btn btn-primary">Login</button>
</form>


            <p class="mt-3 text-center">
                Don't have an account? <a href="{{ url_for('controller.register') }}">Register here</a>
            </p>
        </div>
    </div>
</body>
</html>
