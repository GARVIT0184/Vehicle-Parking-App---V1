<!-- templates/book_parking.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Book Parking</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h2>Book a Parking Spot</h2>
        <form method="POST" class="row g-3 mb-4">
            <div class="col-auto">
                <input type="text" name="pincode" placeholder="Enter Pincode" class="form-control" required>
            </div>
            <div class="col-auto">
                <button type="submit" class="btn btn-primary mb-3">Search</button>
            </div>
        </form>

        {% if lots %}
        <h4>Available Parking Lots</h4>
        <ul class="list-group">
            {% for lot in lots %}
            <li class="list-group-item d-flex justify-content-between align-items-center">
                <div>
                    <strong>{{ lot.name }}</strong><br>
                    {{ lot.address }} - {{ lot.pincode }} | ₹{{ lot.price }}/hr
                </div>
                <a href="/book_spot/{{ lot.id }}" class="btn btn-success">Book Spot</a>
            </li>
            {% endfor %}
        </ul>
        {% endif %}
    </div>
</body>
</html>
